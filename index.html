<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Go Trade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>SHARK GO TRADE CALCULATOR</h2>
<p class="creator-tag">Created by <span class="creator-name">DriftTideVR</span> on Discord</p>

<div class="container">
    <div class="side">
        <h3>YOUR OFFER</h3>
        <div id="yourItems"></div>
        <div class="button-row">
            <button class="btn-add" onclick="openPopup('your', 'shark')">+ Add Shark</button>
            <button class="btn-add" onclick="openPopup('your', 'weapon')">+ Add Weapon</button>
        </div>
    </div>

    <div class="side">
        <h3>THEIR OFFER</h3>
        <div id="theirItems"></div>
        <div class="button-row">
            <button class="btn-add" onclick="openPopup('their', 'shark')">+ Add Shark</button>
            <button class="btn-add" onclick="openPopup('their', 'weapon')">+ Add Weapon</button>
        </div>
    </div>
</div>

<div class="btn-calc-container">
    <button class="btn-calc" onclick="calculateTrade()">CALCULATE TRADE</button>
</div>

<div class="result-box" id="results" style="display:none;">
    <h3>TRADE ANALYSIS</h3>
    <p><strong>Trade Fairness:</strong> <span id="fairnessPct">0</span>% Equal</p>
    <p><strong>Verdict:</strong> <span id="verdict"></span></p>
</div>

<div id="sharkModal" class="modal">
    <div class="modal-content">
        <h3>Select a Shark</h3>
        <div class="item-options">
            <button class="modal-item-btn" onclick="confirmAddItem(10, 'White Shark', '🦈', '#a8a8a8', 'nightmare', 'shark')">
                <span class="modal-icon" style="background:#a8a8a8">🦈</span> White Shark
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(20, 'Hammerhead', '🔨', '#ff6b81', 'nightmare', 'shark')">
                <span class="modal-icon" style="background:#ff6b81">🔨</span> Hammerhead
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(30, 'Starfish', '⭐', '#f1c40f', 'nightmare,crystal', 'shark')">
                <span class="modal-icon" style="background:#f1c40f">⭐</span> Starfish
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(40, 'Lobster', '🦞', '#e74c3c', 'nightmare,crystal', 'shark')">
                <span class="modal-icon" style="background:#e74c3c">🦞</span> Lobster
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(50, 'Manta Ray', '🪼', '#2ed573', 'nightmare', 'shark')">
                <span class="modal-icon" style="background:#2ed573">🪼</span> Manta Ray
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(55, 'Sea Dragon', '🌊', '#3498db', 'nightmare', 'shark')">
                <span class="modal-icon" style="background:#3498db">🌊</span> Sea Dragon
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(60, 'Seal', '🦭', '#95a5a6', 'nightmare,crystal', 'shark')">
                <span class="modal-icon" style="background:#95a5a6">🦭</span> Seal
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(70, 'Narwhal', '🦄', '#9b59b6', 'nightmare,crystal', 'shark')">
                <span class="modal-icon" style="background:#9b59b6">🦄</span> Narwhal
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(80, 'Axolotl', '🦎', '#ffa801', 'nightmare', 'shark')">
                <span class="modal-icon" style="background:#ffa801">🦎</span> Axolotl
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(85, 'Crystal Crab', '🦀', '#00d2d3', 'nightmare', 'shark')">
                <span class="modal-icon" style="background:#00d2d3">🦀</span> Crystal Crab
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(90, 'Pixel Narwhal', '👾', '#54a0ff', 'none', 'shark')">
                <span class="modal-icon" style="background:#54a0ff">👾</span> Pixel Narwhal
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(90, 'Shenloong Jr', '🐲', '#10ac84', 'none', 'shark')">
                <span class="modal-icon" style="background:#10ac84">🐲</span> Shenloong Jr
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(95, 'Pixel Axolotl', '👾', '#ff9ff3', 'none', 'shark')">
                <span class="modal-icon" style="background:#ff9ff3">👾</span> Pixel Axolotl
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(95, 'Ghost Shark', '👻', '#c8d6e5', 'none', 'shark')">
                <span class="modal-icon" style="background:#c8d6e5">👻</span> Ghost Shark
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(180, 'King Manta', '👑🪼', '#f39c12', 'nightmare', 'shark')">
                <span class="modal-icon" style="background:#f39c12">👑🪼</span> King Manta
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(200, 'Krocotron', '🐊', '#20bf6b', 'nightmare', 'shark')">
                <span class="modal-icon" style="background:#20bf6b">🐊</span> Krocotron
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(220, 'Boxing Orca', '🥊', '#eb3b5a', 'none', 'shark')">
                <span class="modal-icon" style="background:#eb3b5a">🥊</span> Boxing Orca
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(280, 'Shenloong', '🐉', '#fa8231', 'nightmare', 'shark')">
                <span class="modal-icon" style="background:#fa8231">🐉</span> Shenloong
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(320, 'Titan Turtle', '🐢', '#26de81', 'none', 'shark')">
                <span class="modal-icon" style="background:#26de81">🐢</span> Titan Turtle
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(380, 'King of Sharks', '👑', '#fed330', 'none', 'shark')">
                <span class="modal-icon" style="background:#fed330">👑</span> King of Sharks
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(450, 'Sharkzilla', '🦖', '#fc5c65', 'none', 'shark')">
                <span class="modal-icon" style="background:#fc5c65">🦖</span> Sharkzilla
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(550, 'Metalodon', '⚙️', '#4b6584', 'none', 'shark')">
                <span class="modal-icon" style="background:#4b6584">⚙️</span> Metalodon
            </button>
        </div>
        <button class="btn-close" onclick="closePopup()">Cancel</button>
    </div>
</div>

<div id="weaponModal" class="modal">
    <div class="modal-content">
        <h3>Select a Weapon</h3>
        <div class="item-options">
            <button class="modal-item-btn" onclick="confirmAddItem(10, 'Drill', '🔩', '#74b9ff', 'nightmare', 'weapon')">
                <span class="modal-icon" style="background:#74b9ff">🔩</span> Drill
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(10, 'Cannon', '💣', '#6c5ce7', 'none', 'weapon')">
                <span class="modal-icon" style="background:#6c5ce7">💣</span> Cannon
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(10, 'Saw', '⚙️', '#a29bfe', 'nightmare', 'weapon')">
                <span class="modal-icon" style="background:#a29bfe">⚙️</span> Saw
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(10, 'Booster', '🚀', '#fd79a8', 'none', 'weapon')">
                <span class="modal-icon" style="background:#fd79a8">🚀</span> Booster
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(15, 'Arm', '🦾', '#ff7675', 'none', 'weapon')">
                <span class="modal-icon" style="background:#ff7675">🦾</span> Arm
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(30, 'Dual Arm', '🦾', '#e17055', 'none', 'weapon')">
                <span class="modal-icon" style="background:#e17055">🦾</span> Dual Arm
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(30, 'Double Cannon', '💥', '#d63031', 'nightmare', 'weapon')">
                <span class="modal-icon" style="background:#d63031">💥</span> Double Cannon
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(35, 'Homing Booster', '🎯', '#00b894', 'none', 'weapon')">
                <span class="modal-icon" style="background:#00b894">🎯</span> Homing Booster
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(35, 'Extending Saw', '🪚', '#00cec9', 'none', 'weapon')">
                <span class="modal-icon" style="background:#00cec9">🪚</span> Extending Saw
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(40, 'Shark Booster', '🦈', '#0984e3', 'nightmare', 'weapon')">
                <span class="modal-icon" style="background:#0984e3">🦈</span> Shark Booster
            </button>
            <button class="modal-item-btn" onclick="confirmAddItem(50, 'Minigun', '🔫', '#fdcb6e', 'nightmare', 'weapon')">
                <span class="modal-icon" style="background:#fdcb6e">🔫</span> Minigun
            </button>
        </div>
        <button class="btn-close" onclick="closePopup()">Cancel</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
